<div>
     <h1>{{this.pageTitle}}</h1>
</div>
<hr>
<div align="right" style="padding:1em;">
        <button class="btn btn-primary" (click)="this.toggleList()">{{this.toogleLisCaption}}</button>
        <ul *ngIf="isListVisible" align="left" widdth="10px" class="reference_base">
            <li *ngFor="let _page of this._pages">{{_page.text}}
                <ul *ngIf="(this._pages_nested !== null)">
                  <li *ngIf="!(this._pages_nested[(_page.id - 1)].routerLink == 'about:blank')">
                      <a [routerLink]="_pages_nested[_page.id - 1].routerLink" 
                        [queryParams]="_pages_nested[_page.id - 1].queryParamsObj">
                              {{ _pages_nested[_page.id - 1].text }}
                      </a>
                  </li>
                  <li *ngIf="!(this._pages_nested[(_page.id - 1)].url        == 'about:blank')">
                        <a [href]="this._pages_nested[(_page.id - 1)].url" target="_blank">
                              {{ this._pages_nested[(_page.id - 1)].text }}
                        </a>
                  </li>
                </ul>
            </li>
        </ul>
  </div>
