<div align="center" class="animate">
  <h4>{{this._appBrand}}!</h4>
  <hr>
    <app-landing [LandingPage]="this.selectedLandingPage">
    </app-landing>
    <hr>
      @for (page of this._pages; track page) {
        <span>
          @if (page) {
            <span style="padding:5px;">
              <a [routerLink]="page.url" [queryParams]="page.queryParamsObj"><span align="left">{{page.text}}</span></a>
            </span>
          }
        </span>
      }
    </div>
