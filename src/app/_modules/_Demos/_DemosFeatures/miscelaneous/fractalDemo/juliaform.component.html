<div class="content" align="center">
    <app-base-reference></app-base-reference>
    <hr>
    <div class="form-container">
        <h2>Fractal Parameters</h2>
        <form (ngSubmit)="onSubmit()">
            
            <div class="form-group">
                <label for="implementation">Implementation:</label>
                <select id="implementation" name="implementation" 
                        [(ngModel)]="selectedImplementation"
                        class="implementation-select"
                        (change)="status_message.set('')">
                    <option *ngFor="let option of implementationOptions" [value]="option.value">
                        {{option.icon}} {{option.label}} - {{option.description}}
                    </option>
                </select>
                <small class="form-text">
                    Currently using: {{getSelectedImplementationIcon()}} {{getSelectedImplementationDescription()}}
                </small>
            </div>
            
            <!--           
            <div class="form-group">
                <label for="maxIterations">Max Iterations: {{maxIterations}}</label>
                <input type="range" id="maxIterations" name="maxIterations" 
                       [(ngModel)]="maxIterations" 
                       [min]="100" [max]="2000" [step]="50"
                       required class="slider">
            </div>

            <div class="form-group">
                <label for="realPart">Real Part: {{realPart.toFixed(3)}}</label>
                <input type="range" id="realPart" name="realPart" 
                       [(ngModel)]="realPart" 
                       [min]="-2.0" [max]="2.0" [step]="0.01"
                       required class="slider">
            </div>
            
            <div class="form-group">
                <label for="imagPart">Imaginary Part: {{imagPart.toFixed(3)}}</label>
                <input type="range" id="imagPart" name="imagPart" 
                       [(ngModel)]="imagPart" 
                       [min]="-2.0" [max]="2.0" [step]="0.01"
                       required class="slider">
            </div>
            -->

            <div class="button-group">
                <button type="submit" class="btn btn-primary" 
                        [disabled]="status_message() === '[...Generating please wait...]'">
                    {{submitTitle}}
                </button>
                
                <button type="button" class="btn btn-secondary" 
                        [disabled]="status_message() === '[...Generating PDF...]'" 
                        *ngIf="imageUrl" (click)="GeneratePDF()">
                    {{pdfButtonCaption}}
                </button>
                
                <button type="button" class="btn btn-outline-danger" 
                        (click)="resetToDefaults()">
                    Reset to Defaults
                </button>
            </div>
            
            <hr>
            
            <div *ngIf="status_message()" class="alert alert-secondary" role="alert" align="center">
                {{ status_message() }}
            </div>
            
            <div *ngIf="generationTime && lastImplementationUsed" 
                 class="alert-performance" 
                 [ngClass]="{
                   'performance-success': getPerformanceColor() === 'success',
                   'performance-warning': getPerformanceColor() === 'warning',
                   'performance-info': getPerformanceColor() === 'info'
                 }"
                 align="center">
                ⏱️ Generation time: {{generationTime.toFixed(2)}}ms using {{lastImplementationUsed}}
            </div>
            
        </form>
        
        <hr>
        
        <div *ngIf="imageUrl" #_fractal_image>
            <h3>Generated Fractal Image:</h3>
            <img [src]="imageUrl" alt="Fractal Image" width="350px" height="350px"/>
        </div>
        
    </div>
    
    <hr>
    
    <div align="right">
        <a [routerLink]="'/PageUrlList'" 
           [queryParams]="{pageName: 'PAGE_DEMOS_MISCELLANEOUS_INDEX'}">
            [Back to Menu]
        </a>
    </div>
</div>
