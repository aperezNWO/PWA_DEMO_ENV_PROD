<div>
<app-base-reference></app-base-reference>
<div class="card">
    <h2>Groq Model Test for Angular</h2>

    <hr>

    <div class="form-group">
        <label for="apiKey">Groq API Key: (get it from <a href="https://console.groq.com/keys" target="_blank" style="color:black;">Groq Console</a>)</label>
        <div class="input-wrapper">
            <input 
                type="password" 
                id="apiKey" 
                [(ngModel)]="apiKey" 
                placeholder="gsk_..." 
            />
            @if (apiKey()) {
                <button type="button" class="clear-btn" (click)="clearApiKey()" title="Clean API Key">×</button>
            }
        </div>
    </div>

    <div class="form-group">
        <label for="modelSelect">Select Model:</label>
        <select id="modelSelect" [(ngModel)]="selectedModel" class="model-select">
            @for (m of models; track m.id) {
                <option [value]="m.id">{{ m.name }}</option>
            }
        </select>
        <hr>
        <small class="helper-text">
            * <em>GPT-OSS models</em> automatically trigger web search with non-streaming execution. <em>Other models</em> utilize real-time chunk streaming.
        </small>
    </div>
    
    <div class="form-group">
        <label for="prompt">Message:</label>
        <div class="input-wrapper">
            <input 
                type="text" 
                id="prompt" 
                [(ngModel)]="prompt" 
            />
            @if (prompt()) {
                <button type="button" class="clear-btn" (click)="clearPrompt()" title="Clear message">×</button>
            }
        </div>
    </div>
    
    <div class="button-group">
        <button (click)="testGroq()" [disabled]="isLoading()">
            {{ isLoading() ? 'Processing...' : 'Send Request' }}
        </button>
        @if (responseStream()) {
            <button class="clear-results-btn" (click)="clearResults()">Clear Results</button>
        }
    </div>

    <hr>

    <h4>Real time answer:</h4>
    <pre class="output-box">{{ responseStream() }}</pre>

</div>

  <div align="right">
    <a [routerLink]="'/PageUrlList'" [queryParams]="{pageName : 'PAGE_DEMOS_MISCELLANEOUS_INDEX'}">
      [ &laquo; Return to Menu ]
    </a>
  </div>
</div>
