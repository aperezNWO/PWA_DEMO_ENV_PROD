<app-base-reference></app-base-reference>
<div class="card">
    
    <h2>Prueba de Modelo Groq en Angular </h2>
    
    <div class="form-group">
        <label for="apiKey">Groq API Key: (get it from <a href="https://console.groq.com/keys" target="_blank" style="color:black;">Groq Console</a>)</label>
        <input 
            type="password" 
            id="apiKey" 
            [(ngModel)]="apiKey" 
            placeholder="gsk_..." 
        />
    </div>
    
    <div class="form-group">
        <label for="prompt">Mensaje:</label>
        <input 
            type="text" 
            id="prompt" 
            [(ngModel)]="prompt" 
        />
    </div>
    
    <button (click)="testGroq()" [disabled]="isLoading()">
        {{ isLoading() ? 'Procesando...' : 'Enviar petición con Streaming' }}
    </button>

    <h3>Respuesta en tiempo real:</h3>
    <pre class="output-box">{{ responseStream() }}</pre>
</div>
