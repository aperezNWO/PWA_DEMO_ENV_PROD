<div class="ocr-container" align="center">
  <app-base-reference></app-base-reference>
  
  @let parsing = isParsing();

  <div class="capture-card">
    
    <div id="canvasContainer" [hidden]="hiddenCanvasContainer()">
      <div class="instruction-text">Draw text clearly on the pad:</div>
      <ngx-signature-pad #signature [options]="options"></ngx-signature-pad>
      <div class="button-row">
        <button class="btn btn-primary" (click)="saveSignature()" [disabled]="parsing">
          {{ parsing ? 'PROCESSING...' : '[SAVE]' }}
        </button>
        <button class="btn btn-secondary" (click)="clearSignature()">CLEAR</button>
      </div>
    </div>

    <div id="cameraContainer" [hidden]="hiddenCameraContainer()">
      <div [hidden]="cameraContainerHidden()">
        <video #video autoplay [style]="videoStyle" class="video-feed"></video>
        <canvas #canvas hidden></canvas>
        <div class="button-row">
          <button class="btn btn-dark" (click)="capturePhoto()">CAPTURE</button>
          <button class="btn btn-info" (click)="flipCamera()">FLIP</button>
        </div>
      </div>
      
      @if (capturedImage()) {
        <div [hidden]="capturedImageHidden()" class="preview-box">
          <img [src]="capturedImage()" class="img-preview" alt="Captured"/>
          <div class="button-row">
            <button class="btn btn-primary" (click)="saveImage()" [disabled]="parsing">
              {{ parsing ? 'ANALYZING...' : '[SAVE IMAGE]' }}
            </button>
            <button class="btn btn-warning" (click)="cameraContainerHidden.set(false); capturedImageHidden.set(true)">RETAKE</button>
          </div>
        </div>
      }
    </div>
  </div>

  <div class="result-status-container" [class.parsing-active]="parsing">
    <div class="result-header">
      <span class="dot"></span> OCR SYSTEM OUTPUT
    </div>
    <div class="status-text">
      {{ status_message() || 'READY: Waiting for input...' }}
    </div>
  </div>
 
  <!--
  <div class="engine-info">
    @let res = cppStdVersion;
    @if (res.isLoading()) { <span>Syncing with Engine...</span> }
    @else { <span>Backend: <strong>{{ res.value() }}</strong></span> }
  </div>
 -->

  <hr class="separator">

  <div class="form-group-container">
    <div class="custom-form-group">
      <label>{{ tituloListadOrigen }}</label>
      <select #_sourceList (change)="selectionChange()">
        @for (item of __sourceList; track item._index) {
          <option [value]="item._index" [selected]="item._selected">{{ item._value }}</option>
        }
      </select>
    </div>

    <div class="custom-form-group">
      <label>{{ titleEngineList }}</label>
      <select #_engineList>
        @for (item of __engineList; track item._index) {
          <option [value]="item._index" [selected]="item._selected">{{ item._value }}</option>
        }
      </select>
    </div>
  </div>

  <div class="footer-link">
    <a [routerLink]="['/PageUrlList']" [queryParams]="{pageName : 'PAGE_DEMOS_MISCELLANEOUS_INDEX'}">
      &laquo; Return to Menu
    </a>
  </div>
</div>
