<div class="content">
  <!-- ENCABEZADO / INICIO  -->
  <app-base-reference></app-base-reference>
  <!-- ENCABEZADO / FIN -->
  <hr>
    <div class="game-container">
      <!-- 
        Angular v21: Using signals directly - no async pipe needed
        Call .towers() to get current value from signal
        Track by $index for optimal zoneless performance
      -->
      @for (tower of hanoiEngine.towers(); track $index; let i = $index) {
        <div class="tower">
          <h2>Tower {{ i + 1 }}</h2>
          <div class="disks-container">
            <!-- Track by disk.size for efficient DOM updates in zoneless mode -->
            @for (disk of tower; track disk.size) {
              <div class="disk" [style.width.px]="disk.size * 20">
                {{ disk.size }}
              </div>
            }
          </div>
        </div>
      }
    </div>
    <hr>
      <div align="center">
        <!-- 
          Angular v21: Signal direct access - no pipe needed
          .moves() returns current signal value
          Change detection triggered automatically when signal updates
        -->
        <p>Moves: {{ hanoiEngine.moves() }}</p>
        
        <!-- 
          Angular v21: Computed signal for disabled state
          .isWin() automatically updates when game state changes
        -->
        <button class="btn btn-primary" (click)="hanoiEngine.manual_resetGame()" [disabled]="!hanoiEngine.isWin()">Reset Game</button>
        |
        <button class="btn btn-success" (click)="hanoiEngine.auto_startGame()" [disabled]="hanoiEngine._steps.length > 0">Start Game</button>
      </div>
      <hr />
      <div align="right">
        <a [routerLink]="'/PageUrlList'" [queryParams]="{pageName : 'PAGE_DEMOS_GAMES_INDEX'}">[Back to Menu]</a>
      </div>
    </div>
