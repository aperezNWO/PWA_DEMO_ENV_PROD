<div align="center">
    <!-- ENCABEZADO / INICIO  -->  
    <div align="center">
      <h1>{{  this.pageTitle }}</h1>
    </div>
    <hr> 
    <div class="reference" align="right">
   <button class="btn btn-primary" (click)="this.toggleList()">{{this.toogleLisCaption}}</button>
   <ul *ngIf="isListVisible" align="left" widdth="10px">
      <li> [Frontend]
          <ul>
              <li><a routerLink="/GridParam" [queryParams]="{ searchTerm: '' , pageName : 'PAGE_DEMOS_ANGULAR_JAVASCRIPT' }">[Angular]</a></li>
          </ul>
      </li>
      <li>[Librerias]
          <ul>
              <li><a href="https://v17.angular.io/guide/observables" target="_blank">[Observable]</a></li>
          </ul>
      </li>
      <li>[Temas]
          <ul>
              <li><a href="https://en.wikipedia.org/wiki/Tetris" target="_blank">[Tetris]</a></li>
          </ul>
      </li>
    </ul>
    </div>  
    <!-- ENCABEZADO / FIN -->  
    <hr>
    <!-- TABLERO INICIO -->
  <div class="tetris-container">
    <div class="game-info">
      <span>Score: {{ score }}</span>
      <button (click)="resetGame()" [disabled]="!gameOver">🔄 Restart</button>
    </div>
    <div class="board">
      <div *ngFor="let row of board" class="row">
        <div *ngFor="let cell of row" class="cell" [class.filled]="cell === 1"></div>
      </div>
    </div>
    <div *ngIf="gameOver" class="game-over-overlay">
      <div class="overlay-content">
        <h3>💥 Game Over!</h3>
        <p>Final Score: {{ score }}</p>
        <button (click)="resetGame()">Play Again</button>
      </div>
    </div>
  </div>
    <!-- TABLERO FIN    -->
    <hr />
     <!-- RETURN TO HOME PAGE - INIT -->
     <div align="right">
         <a [routerLink]="'/PageUrlList'" [queryParams]="{pageName : 'PAGE_DEMOS_GAMES_INDEX'}" >[Volver al Menu]</a>
     </div>
     <!-- RETURN TO HOME PAGE - END   -->  
</div>
