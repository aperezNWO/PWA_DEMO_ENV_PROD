<div align="center">
    <!-- ENCABEZADO / INICIO  -->  
    <div align="center">
      <h1>{{  this.pageTitle }}</h1>
    </div>
    <hr> 
    <div class="reference" align="right">
   <button class="btn btn-primary" (click)="this.toggleList()">{{this.toogleLisCaption}}</button>
   <ul *ngIf="isListVisible" align="left" widdth="10px">
      <li> [Frontend]
          <ul>
              <li><a routerLink="/GridParam" [queryParams]="{ searchTerm: '' , pageName : 'PAGE_DEMOS_ANGULAR_JAVASCRIPT' }">[Angular]</a></li>
          </ul>
      </li>
      <li>[Librerias]
          <ul>
              <li><a href="https://v17.angular.io/guide/observables" target="_blank">[Observable]</a></li>
          </ul>
      </li>
      <li>[Temas]
          <ul>
              <li><a href="https://en.wikipedia.org/wiki/Tetris" target="_blank">[Tetris]</a></li>
          </ul>
      </li>
    </ul>
    </div>  
    <!-- ENCABEZADO / FIN -->  
    <hr>
    <!-- TABLERO INICIO -->
    <div class="tetris-container" *ngIf="state" align="center">
      <div class="board">
        <div class="row" *ngFor="let row of getBoardMatrix(); let y = index">
          <div class="cell" *ngFor="let cell of row; let x = index"
               [class.occupied]="cell !== 0" [ngStyle]="getCellStyle(cell)">
          </div>
        </div>
      </div>
      <hr>
      <div class="info">
        <h3>Score: {{ state.score }}</h3>
        <h3>Lines: {{ state.lines }}</h3>
        <h3>Level: {{ state.level }}</h3>
        <h3>Next: {{ state.nextPiece }}</h3>
        <h3 *ngIf="state.gameOver" class="game-over">GAME OVER</h3>
      </div>
      <hr>
      <div class="controls">
        <button (click)="step()">Step AI</button>
        <button (click)="reset()">Reset</button>
        <button (click)="toggleAutoPlay()">
          {{ autoPlaySub ? 'Stop' : 'Start' }} Auto-Play
        </button>
      </div>
    </div>
    <!-- TABLERO FIN    -->
    <hr />
     <!-- RETURN TO HOME PAGE - INIT -->
     <div align="right">
         <a [routerLink]="'/PageUrlList'" [queryParams]="{pageName : 'PAGE_DEMOS_GAMES_INDEX'}" >[Volver al Menu]</a>
     </div>
     <!-- RETURN TO HOME PAGE - END   -->  
</div>
