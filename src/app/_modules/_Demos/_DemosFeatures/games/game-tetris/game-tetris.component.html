<div align="center">
  <!-- ENCABEZADO / INICIO  -->
  <!-- Add your header component reference here if needed -->
  <!-- ENCABEZADO / FIN -->
  <hr>
  <div class="game-container" [class.game-over]="gameOver()">
    <div class="game-board">
      @for (row of displayBoard(); track $index) {
        <div class="row">
          @for (cell of row; track $index) {
            <div
              class="cell"
              [class.filled]="cell"
              [style.background-color]="cell">
            </div>
          }
        </div>
      }
    </div>
    <div class="controls">
      <div class="score">Score: {{score()}}</div>
      @if (!isPlaying() || gameOver()) {
        <button (click)="resetGame()">
          {{gameOver() ? 'Play Again' : 'Start Game'}}
        </button>
      }

      @if (isMobile()) {
        <div class="mobile-controls">
          <button (click)="moveLeft()" style="font-size: x-large;">&larr;</button>
          <button (click)="moveRight()" style="font-size: x-large;">&rarr;</button>
          <button (click)="rotate()">Rotate</button>
          <button (click)="drop()">Drop</button>
        </div>
      }
    </div>
  </div>
  <hr>
  <button (click)="resetGame()">[RESTART]</button>
  <hr />
  <div align="right">
    <a [routerLink]="'/PageUrlList'" [queryParams]="{pageName : 'PAGE_DEMOS_GAMES_INDEX'}">[Back to Menu]</a>
  </div>
</div>
