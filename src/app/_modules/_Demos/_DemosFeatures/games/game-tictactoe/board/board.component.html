<!-- TABLERO INICIO -->
@if (this.showBoard) {
  <div  class="tictactoe-board" align="center">
    @for (i of [0, 1, 2]; track i) {
      <div class="board-row">
        @for (j of [0, 1, 2]; track j) {
          <app-square
            [value]="ticTacToeEngine.squares[i * 3 + j]"
            (clickEvent)="makeMove(i * 3 + j)"
          ></app-square>
        }
      </div>
    }
  </div>
}
<!-- TABLERO FIN    -->
<hr>
  <form>
    <!-- LISTADO JUGADOR INICIAL / INICIO -->
    <div class="form-group" id="SourceListDiv" align="center">
      <span id="tituloSource">{{this.tituloSource}}</span>
      <label for="_SourceList"></label>
      |
      <select id="_SourceList"
        name="_SourceList"
        #_SourceList
        (change)="this._tituloSourceChanged()"
        [disabled]="(this.IsNewGame == false)">
        @for (_SourceName of __SourceList; track _SourceName) {
          <option
            [value]   ="_SourceName._index"
            [selected]="_SourceName._selected">{{_SourceName._value}}
          </option>
        }
      </select>
    </div>
    <!--LISTADO JUGADOR INICIAL / FIN    -->
    <!--BOTONES INICIO -->
    <hr>
      <div class="form-group" align="center">
        <input class="btn btn-primary"   type="button" value="[New]"   (click)="this.newGame();"   [disabled]="(this.IsNewGame == true)">
        |
        <input class="btn btn-success"   type="button" value="[Start]" (click)="this.startGame();" [disabled]="(this.IsNewGame == false)">
      </div>
      <!--BOTONES FIN    -->
      <hr>
        <!--STATUS / INICIO -->
        <div class="form-group" align="center">
          @if (this.ticTacToeEngine.message()) {
            <div class="alert alert-secondary" role="alert"><b>{{ this.ticTacToeEngine.message() }}</b></div>
          }
        </div>
        <!-- STATUS / FIN   -->
      </form>
