<div class="content">    
      <!-- ENCABEZADO / INICIO  -->  
      <div align="center">
            <h1>{{  this.pageTitle }}</h1>
            </div>
            <hr> 
            <div class="reference" align="right">
                <button class="btn btn-primary" (click)="this.toggleList()">{{this.toogleLisCaption}}</button>
                <ul *ngIf="isListVisible" align="left" widdth="10px">
                <li> [Frontend]
                    <ul>
                        <li><a routerLink="/GridParam" [queryParams]="{ searchTerm: 'e9ee9d64-65ad-49a3-8595-5479300b4264' , pageName : 'PAGE_DEMOS_ANGULAR_JAVASCRIPT' }">[Angular]</a></li>
                    </ul>
                </li>
                <li>[Temas]
                    <ul>
                        <li><a href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">[Tic Tac Toe]</a></li>
                    </ul>
                    <ul>
                        <li><a href="https://en.wikipedia.org/wiki/Neural_network_(machine_learning)" target="_blank">[Neural Networks]</a></li>
                    </ul>
                </li>
                </ul>
      </div>  
      <!-- ENCABEZADO / FIN -->  
      <!-- TABLERO / INICIO -->
      <div class="game-container">
        <!-- Game Board -->
        <div class="board">
            <button
            *ngFor="let cell of board; let i = index"
            class="cell"
            [class.x]="cell === 1"
            [class.o]="cell === -1"
            >
            {{ getCellSymbol(cell) }}
            </button>
        </div>

        <!-- Result -->
        <p *ngIf="winner !== null" class="result">
            {{ getWinnerText() }}
        </p>

        <!-- Play Button -->
        <button
        (click)="playGame()"
        [disabled]="isAnimating"
        class="play-btn"
        >
            {{ playButtonLabel }}
        </button>
      </div>
      <!-- TABLERO / FIN    -->
      <hr />
      <div align="right">
          <a [routerLink]="'/PageUrlList'" [queryParams]="{pageName : 'PAGE_DEMOS_GAMES_INDEX'}" >[Volver al Menu]</a>
      </div>
</div>
