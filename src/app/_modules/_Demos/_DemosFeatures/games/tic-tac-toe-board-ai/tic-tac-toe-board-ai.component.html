<div class="content">    
      <!-- ENCABEZADO / INICIO  -->  
      <div align="center">
            <h1>{{  this.pageTitle }}</h1>
       </div>
       <hr> 
       <div class="reference" align="right">
            <button class="btn btn-primary" (click)="this.toggleList()">{{this.toogleLisCaption}}</button>
            <ul *ngIf="isListVisible" align="left" widdth="10px">
            <li> [Frontend]
                <ul>
                    <li><a routerLink="/GridParam" [queryParams]="{ searchTerm: 'e9ee9d64-65ad-49a3-8595-5479300b4264' , pageName : 'PAGE_DEMOS_ANGULAR_JAVASCRIPT' }">[Angular]</a></li>
                </ul>
            </li>
            <li>[Temas]
                <ul>
                    <li><a href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">[Tic Tac Toe]</a></li>
                </ul>
                <ul>
                    <li><a href="https://en.wikipedia.org/wiki/Neural_network_(machine_learning)" target="_blank">[Neural Networks]</a></li>
                </ul>
            </li>
            </ul>
       </div>  
       <hr>
      <!-- ENCABEZADO / FIN -->  
      <!-- TABLERO / INICIO -->
      <div class="game-container">
        <!-- Controls -->
        <div class="controls">
            <!-- Ensure it's loadGame(), not playGame -->
            <button class="button_tictactoe" (click)="loadGame()" [disabled]="loading">
            {{ loading ? 'Loading...' : '🔁 Replay Game' }}
            </button>
            <!-- AI Style Dropdown -->
            <label>
            AI Style:
            <select [value]="aiMode" (change)="onAiModeChange($event)">
                <option value="0">Expert AI</option>
                <option value="1">Creative AI</option>
                <!--<option value="2">Minimax (Perfect)</option>-->
                <option value="3">Random Player</option>
            </select>
            </label>

            <!-- Temperature Slider -->
            <label *ngIf="aiMode === 1">
            Creativity:
            <input 
                type="range" 
                min="0.1" max="2.0" step="0.1"
                [value]="temperature" 
                (input)="onTempChange($event)"
            >
            {{ temperature.toFixed(1) }}
            </label>


        </div>        
        <!-- Error -->
        <div class="error" *ngIf="error">
            ⚠️ {{ error }}
        </div>

        <!-- Loading -->
        <div class="loading" *ngIf="loading">
            🧠 AI is generating a game...
        </div>

        <!-- Board -->
        <div align="center" class="board" *ngIf="!loading && !error">
            <div *ngFor="let cell of gameHistory[currentStep]; let i = index"
                class="{{ getCellClass(cell, i) }}">
            {{ getCellSymbol(cell) }}
            </div>
        </div>

        <!-- Game Info -->
        <div class="game-info" *ngIf="!loading && gameHistory.length > 0">
            <p><strong>Step {{ currentStep }} / {{ gameHistory.length - 1 }}</strong></p>
            <p>Winner: <strong>{{ getCurrentWinner() }}</strong></p>
        </div>
      <!-- TABLERO / FIN    -->
      </div>
      <hr />
      <div align="right">
          <a [routerLink]="'/PageUrlList'" [queryParams]="{pageName : 'PAGE_DEMOS_GAMES_INDEX'}" >[Volver al Menu]</a>
      </div>
</div>
