<div class="container">
  <h2>Rubik's Cube 3D</h2>
  <p class="instructions">🖱️ Drag to rotate view | ⌨️ Tap buttons to rotate faces</p>
  
  <div #rendererContainer class="renderer-container"></div>

  <div class="controls">
    <!-- Direction Toggle -->
    <div class="control-group full-width">
      <span>Rotation Direction</span>
      <div class="direction-toggle">
        <button [class.active]="isClockwise" (click)="isClockwise = true">Clockwise ↻</button>
        <button [class.active]="!isClockwise" (click)="isClockwise = false">Counter-CW ↺</button>
      </div>
    </div>

    <!-- Face Rotations -->
    <div class="control-group">
      <span>Face Moves</span>
      <div class="button-row">
        <button (click)="rotateFace('x', 1, isClockwise)">Right</button>
        <button (click)="rotateFace('x', -1, isClockwise)">Left</button>
      </div>
      <div class="button-row">
        <button (click)="rotateFace('y', 1, isClockwise)">Top</button>
        <button (click)="rotateFace('y', -1, isClockwise)">Bottom</button>
      </div>
      <div class="button-row">
        <button (click)="rotateFace('z', 1, isClockwise)">Front</button>
        <button (click)="rotateFace('z', -1, isClockwise)">Back</button>
      </div>
    </div>

    <!-- System Controls -->
    <div class="control-group system">
      <span>System</span>
      <button class="btn-secondary" (click)="resetView()">Reset View</button>
      <button class="btn-danger" (click)="resetCube()">Full Reset Cube</button>
    </div>
  </div>
</div>
