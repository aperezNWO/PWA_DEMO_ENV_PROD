<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Groq SDK en Navegador</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px 0; font-size: 16px; }
        input { width: 100%; box-sizing: border-box; }
        button { background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #4338ca; }
        pre { background: #1e1e1e; color: #dcdcdc; padding: 15px; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; min-height: 100px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Prueba de Modelo Groq</h2>
        <label for="apiKey">Groq API Key: (get it from <a href="https://console.groq.com/keys" target="_blank">Groq Console</a>)</label>
        <input type="password" id="apiKey" placeholder="gsk_..."  value="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"/>
        
        <label for="prompt">Mensaje:</label>
        <input type="text" id="prompt" value="Escribe un poema corto sobre la programacion" />
        
        <button id="sendBtn">Enviar petición con Streaming</button>

        <h3>Respuesta en tiempo real:</h3>
        <pre id="output"></pre>
    </div>

    <!-- Importar la SDK de Groq mediante ESM desde un CDN -->
    <script type="module" src="./grok.js"></script>
</body>
</html>
