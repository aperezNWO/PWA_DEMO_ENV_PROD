<div align="left">
  <h1>[INDEX]</h1>
  <hr>
  <form>
    <div class="mb-3 row">
      <label for="table-complete-search" class="col-xs-3 col-sm-auto col-form-label">Full Text Search:</label>
      <div class="col-xs-3 col-sm-auto">
        <input
          id="table-complete-search"
          type="text"
          class="form-control"
          name="searchTerm"
          [ngModel]="searchTerm()"
          (ngModelChange)="setSearchTerm($event)"
        />
      </div>
      <span class="col-sm-auto">
        <div>
          <app-speech-panel
            (clickEventSpeak)="speakText($event)"
            (clickEventClearText)="clearText()">
          </app-speech-panel>
        </div>
      </span>
      @if (loading()) {
        <span class="col col-form-label">[Loading...]</span>
      }
    </div>
    
    <table class="table table-striped table-dark">
      <thead>
        <tr>
          <th scope="col" appSortable [sortable]="'id'"   (sort)="onSort($event)">#</th>
          <th scope="col" appSortable [sortable]="'path'" (sort)="onSort($event)">[Pagina]</th>
        </tr>
      </thead>
      <tbody>
        @for (featurePage of pagelist(); track featurePage.path) {
          @if (!((featurePage.path === '') && (featurePage.caption === ''))) {
            <tr>
              <th scope="row">{{ featurePage.id }}</th>
              <td>
                <a [routerLink]="'/' + featurePage.path" [queryParams]="{pageName: featurePage.queryParams}">
                  <ngb-highlight [result]="featurePage.caption" [term]="searchTerm()" />
                </a>
              </td>
            </tr>
          }
        } @empty {
          <tr>
            <td colspan="4" style="text-align: center">[NO SE ENCONTRARON DATOS]</td>
          </tr>
        }
      </tbody>
    </table>
    
    <div class="d-flex justify-content-between p-2">
      <ngb-pagination 
        [collectionSize]="total()" 
        [(page)]="page"
        [pageSize]="pageSize()">
      </ngb-pagination>

      <select 
        class="form-select" 
        style="width: auto" 
        name="pageSize" 
        [ngModel]="pageSize()" 
        (ngModelChange)="setPageSize($event)">
        <option [ngValue]="2">2 items por Pagina</option>
        <option [ngValue]="4">4 items por Pagina</option>
        <option [ngValue]="6">6 items por Pagina</option>
        <option [ngValue]="10">10 items por Pagina</option>
      </select>
    </div>
  </form>
</div>
<hr>
<div align="right">
  <a routerLink="/Home">[Home]</a>
</div>
